[package]
name = "saberkit-py"
description = "Python bindings for saberkit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
# `extension-module` skips linking libpython so the cdylib can load inside an
# interpreter. It must be off for `cargo test`, whose harness links its own
# binary; hence tests run as:
#
#     cargo test -p saberkit-py --no-default-features
#
# The tested code paths (cast_f64, chunk merging, null handling) never touch
# Python objects, so no interpreter is needed.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
# Forces pyo3 to locate and link libpython when building the test harness
# (which cannot use `extension-module`; see above).
pyo3 = { workspace = true, features = ["auto-initialize"] }

[dependencies]
saberkit-core = { path = "../saberkit-core" }
# abi3-py311 (not py310) is required: pyo3-arrow's default `buffer_protocol`
# feature only supports abi3 from 3.11 up.
pyo3 = { workspace = true, features = ["extension-module", "abi3-py311"] }
pyo3-arrow.workspace = true
arrow-array.workspace = true
arrow-cast.workspace = true
arrow-schema.workspace = true
