[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "saberkit"
description = "Fast batch sabermetrics: plus/minus statistics and Savant-style league percentiles, in Rust"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE"]
requires-python = ">=3.11"
dynamic = ["version"]
keywords = ["baseball", "sabermetrics", "statistics", "arrow", "rust"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Deliberately empty. Arrow data arrives over the PyCapsule interface, so
# neither pyarrow nor numpy is required at runtime.
dependencies = []

[project.optional-dependencies]
data = ["pybaseball>=2.2.7", "pandas>=2.0"]
dev = ["pytest>=8", "polars>=1.3", "pyarrow>=15", "pandas>=2.2"]

[project.urls]
Repository = "https://github.com/harlanljones/saberkit"

[tool.maturin]
manifest-path = "crates/saberkit-py/Cargo.toml"
python-source = "python"
module-name = "saberkit._core"
strip = true
include = [
    { path = "RELEASING.md", format = "sdist" },
    { path = "scripts/README.md", format = "sdist" },
    { path = "scripts/generate_season_constants.py", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
