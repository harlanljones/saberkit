name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The statistical core carries no Python linkage, so this needs no
      # interpreter and is the fast inner loop.
      - run: cargo test -p saberkit-core

      # Native tests for the binding layer (cast/null/multi-chunk paths).
      # `extension-module` must be off so the harness can link; build.rs then
      # links libpython from the setup-python interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test -p saberkit-py --no-default-features
        env:
          PYO3_PYTHON: python

      # pyo3-arrow pins arrow-* to one major version. Two copies of arrow-array
      # in the graph produce a baffling "expected ArrayRef, found ArrayRef",
      # so fail loudly here instead.
      - name: Check for duplicate arrow crates
        run: |
          if cargo tree --workspace --duplicates | grep -q '^arrow-'; then
            echo "Duplicate arrow-rs versions in the dependency graph:"
            cargo tree --workspace --duplicates | grep '^arrow-'
            exit 1
          fi

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # abi3-py311 makes the extension itself version-independent, so this
        # matrix exercises the Python layer and Arrow interop across the
        # supported range rather than rebuilding the same ABI.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The maturin build backend handles the editable install, compiling the
      # extension in place.
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python examples/savant_bubbles.py

  minimal:
    name: No pyarrow, no numpy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install maturin
      - run: maturin build --locked --out dist

      # Guards the headline claim: pyo3-arrow pulls rust-numpy in transitively,
      # so prove a polars-only install still imports and computes. Installing
      # the wheel with --no-deps and only polars alongside is the whole point.
      - name: Install into a polars-only environment
        run: |
          python -m venv /tmp/minimal
          /tmp/minimal/bin/pip install polars
          /tmp/minimal/bin/pip install --no-deps dist/*.whl

      - name: Verify no pyarrow or numpy is present
        run: |
          /tmp/minimal/bin/python - <<'PY'
          import importlib.util, sys
          for forbidden in ("numpy", "pyarrow"):
              if importlib.util.find_spec(forbidden) is not None:
                  sys.exit(f"{forbidden} unexpectedly installed")
          print("confirmed: neither numpy nor pyarrow present")
          PY

      - name: Compute with polars alone
        run: |
          /tmp/minimal/bin/python - <<'PY'
          import polars as pl, saberkit
          assert round(saberkit.obp(150, 60, 5, 500, 5), 6) == 0.377193
          league = saberkit.LeagueContext.for_season(2024)
          out = pl.Series(saberkit.ops_plus(
              pl.Series([0.400]), pl.Series([0.500]),
              ctx=league,
          ))
          assert out.to_list()[0] > 100
          assert saberkit.fip(20, 50, 5, 200, 200.1, ctx=league) is not None
          print("polars-only round trip and season context OK")
          PY

  wheels:
    name: Wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: wheels-linux-x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: wheels-linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: wheels-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: wheels-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: wheels-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
